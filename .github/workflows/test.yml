name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # The capture test needs `dsh` on PATH and a profile to boot, so it is not a
  # default gate. It runs here as a smoke signal once `dsh` is installed; a
  # failure only means "re-verify the prompt surface by hand", which is why it
  # is allowed to fail instead of blocking a release.
  capture:
    name: capture (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm i -g @deepseek-ai/dsh
      - run: dsh plugin --profile headless add "$PWD"
      - run: node test/capture-prompt.mjs --persona _selftest "What is 1+1?"
